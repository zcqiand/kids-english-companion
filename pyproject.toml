[project]
name = "kids-english-companion"
version = "0.1.0"
description = "英语启蒙伙伴——记得住孩子学习进度的动画 IP 角色英语启蒙 Agent（FastAPI + OpenAI 兼容直调）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.54,<0.55",
    "openai>=2.54,<2.55",
    "pydantic>=2.12,<2.13",
    "langgraph>=0.4,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
